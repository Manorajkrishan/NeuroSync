name: Retrain emotion model

on:
  push:
    branches: [ p2/ai-quality-rebuild ]
    paths:
      - '.github/workflows/retrain-emotion-model.yml'
      - 'NeuroSync.Trainer/**'
      - 'NeuroSync.ML/**'
      - 'NeuroSync.Api/Scripts/prepare_goemotions.py'
      - 'NeuroSync.Api/Data/emotions.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Prepare GoEmotions
        run: |
          python3 NeuroSync.Api/Scripts/prepare_goemotions.py \
            --output-dir /tmp/neurosync-goemotions

      - name: Restore trainer
        run: dotnet restore NeuroSync.Trainer/NeuroSync.Trainer.csproj

      - name: Train and evaluate
        run: |
          dotnet run --project NeuroSync.Trainer/NeuroSync.Trainer.csproj \
            --configuration Release --no-restore -- \
            --train /tmp/neurosync-goemotions/goemotions-train.csv \
            --dev /tmp/neurosync-goemotions/goemotions-dev.csv \
            --test /tmp/neurosync-goemotions/goemotions-test.csv \
            --local NeuroSync.Api/Data/emotions.csv \
            --model NeuroSync.Api/Models/emotion-model.zip \
            --report NeuroSync.Api/Models/emotion-model.metrics.json \
            --min-macro-f1 0.35

      - name: Commit evaluated model artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NeuroSync.Api/Models/emotion-model.zip NeuroSync.Api/Models/emotion-model.metrics.json
          if git diff --cached --quiet; then
            echo "Model artifact unchanged."
          else
            git commit -m "ml: retrain emotion model on clean human data [skip retrain]"
            git push
          fi
